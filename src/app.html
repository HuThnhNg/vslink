<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="VSLink — dịch và học Ngôn ngữ Ký hiệu Việt Nam ngay trên trình duyệt, cùng bạn chó Mèo." />
		<meta name="theme-color" content="#3680c2" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			// Chon giao dien sang/toi truoc khi ve de khong nhay mau.
			try {
				const t = localStorage.getItem('vslink-giao-dien');
				if (t === 'toi' || t === 'sang') document.documentElement.dataset.giaoDien = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
